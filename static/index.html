<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#17191B">
  <title>Bulb Voice</title>
  <meta name="description" content="Bulb Voice: play YouTube, YouTube Music and radio on the speakers in the house.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2317191B'/%3E%3Crect x='5' y='8' width='22' height='16' rx='2' fill='%23D6D9D4'/%3E%3Crect x='15' y='6' width='2' height='20' fill='%23E0281F'/%3E%3C/svg%3E">
  <link rel="preload" href="/static/fonts/barlow-condensed-600-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/barlow-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/fonts/fonts.css?v=1">
  <link rel="stylesheet" href="/static/style.css?v=17">
</head>
<body>
  <!-- gstack-lint-disable hero-balance: Bulb Voice is a speaker remote, not a landing page; the display window and transport keys are the first screen -->
  <!-- gstack-lint-disable section-gap: the remote stacks control modules 16px apart (DESIGN.md spacing); landing-page section gaps would push the queue off the phone screen -->
  <!-- gstack-lint-disable small-section-heads: Queue and Speakers are module legends on an Operate screen (DESIGN.md label role), not landing-page section heads -->
  <!-- gstack-lint-disable thin-section: the volume, controls and queue sections are fixed-width faceplate modules per DESIGN.md, not content sections -->
  <!-- gstack-lint-disable low-contrast: the No track title and 0:00 time sit on the Bulb Voice backlit window, layered gradients the lint reads as black; measured on the render: ink 6.1:1, artist ink 4.6:1 against the darkest glass -->
  <a class="skip" href="#main">Skip to content</a>
  <div class="app">
    <header>
      <h1>Bulb Voice</h1>
      <div class="header-right">
        <button id="btn-devices" class="device-btn" title="Switch speaker">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M17 2H7c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 18H7V4h10v16zm-5-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-3-8h6v2H9v-2z"/></svg>
          <span id="device-name">--</span>
        </button>
        <span id="device-status" class="lamp err" role="status"><i aria-hidden="true"></i><span class="lamp-word">Offline</span></span>
      </div>
    </header>

    <!-- Device picker (hidden by default) -->
    <section id="device-picker" class="device-picker hidden">
      <div class="picker-header">
        <h2>Speakers</h2>
        <button id="btn-refresh-devices" class="picker-refresh" type="button">Scan</button>
      </div>
      <ul id="device-list"></ul>
    </section>

    <main id="main" class="app-main" tabindex="-1">
    <section class="now-playing">
      <div class="track-info">
        <div id="track-title" class="title">No track</div>
        <div id="track-artist" class="artist"></div>
      </div>
      <div class="progress-wrap">
        <span id="pos-current">0:00</span>
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <span id="pos-duration">0:00</span>
      </div>
    </section>

    <section class="controls" aria-label="Playback">
      <div class="transport">
        <button id="btn-prev" class="key ctrl-btn" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>Prev
        </button>
        <button id="btn-play" class="key ctrl-btn play-btn" type="button" aria-label="Play">
          <svg id="icon-play" aria-hidden="true" viewBox="0 0 24 24" width="26" height="26"><path d="M8 5v14l11-7z"/></svg>
          <svg id="icon-pause" aria-hidden="true" viewBox="0 0 24 24" width="26" height="26" style="display:none"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg>
          <span id="play-label">Play</span>
        </button>
        <button id="btn-next" class="key ctrl-btn" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>Next
        </button>
      </div>
      <div class="modes">
        <button id="btn-stop" class="key" type="button">Stop</button>
        <button id="btn-repeat" class="key on" type="button" aria-pressed="false"><span id="repeat-label">Repeat</span></button>
        <button id="btn-shuffle" class="key on" type="button" aria-pressed="false">Shuffle</button>
      </div>
    </section>

    <section class="volume-section" aria-label="Volume">
      <span class="legend" aria-hidden="true">Vol</span>
      <button id="vol-down" class="key" type="button" aria-label="Volume down">−</button>
      <div class="fader-slot"><input type="range" id="volume-slider" min="0" max="100" value="30" aria-label="Volume"></div>
      <button id="vol-up" class="key" type="button" aria-label="Volume up">+</button>
      <span id="volume-val" aria-hidden="true">30</span>
    </section>

    <section class="add-section">
      <form id="add-form">
        <input type="text" id="url-input" placeholder="Search YouTube or paste URL" autocomplete="off" autocapitalize="off" aria-label="Search YouTube or paste URL">
        <button type="submit" id="btn-add" aria-label="Search">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </button>
      </form>
      <div id="download-progress" class="dl-progress hidden">
        <div class="dl-header">
          <span id="dl-text">Downloading</span>
          <span id="dl-count"></span>
        </div>
        <div class="dl-bar"><div id="dl-fill" class="dl-fill"></div></div>
        <ul id="dl-tracks"></ul>
      </div>
    </section>

    <!-- Search results (hidden by default) -->
    <section id="search-results" class="search-results hidden">
      <div class="search-header">
        <h2 id="search-title">Results</h2>
        <button id="btn-close-search" class="search-close" type="button" aria-label="Close results">&times;</button>
      </div>
      <ul id="result-list"></ul>
    </section>

    <section class="queue-section">
      <h2>Queue <span id="queue-count"></span><span id="queue-pos"></span></h2>
      <p id="queue-help" class="queue-help">Scroll to browse · Tap a card to play</p>
      <div id="queue-list" tabindex="0" role="region" aria-label="Track queue" aria-describedby="queue-help">
        <div id="queue-stage"></div>
        <div id="queue-spacer"></div>
      </div>
      <div id="queue-scroll" class="hidden">
        <div id="queue-scroll-thumb"></div>
        <button id="queue-playing" class="hidden" type="button" aria-label="Return to current track" title="Return to current track"></button>
      </div>
    </section>

    <section class="log-section">
      <button id="btn-toggle-logs" class="log-toggle" type="button" aria-expanded="false">Logs</button>
      <div id="log-panel" class="log-panel hidden">
        <ul id="log-list"></ul>
      </div>
    </section>
    </main>
  </div>

  <script src="/static/app.js?v=17"></script>
</body>
</html>
